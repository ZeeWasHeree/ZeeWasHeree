name: GitHub Readme Stats Action

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Output Branch
        uses: actions/checkout@v4
        with:
          ref: output

      - name: Generate Main Stats
        uses: stats-organization/github-readme-stats-action@v1
        with:
          token: ${{ secrets.TOKEN }}
          card: stats
          path: stats.svg
          options: "&username=ZeeWasHeree&theme=vue-dark&show_icons=true&include_all_commits=true&count_private=true"

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v1
        with:
          token: ${{ secrets.TOKEN }}
          card: top-langs
          path: languages.svg
          options: "&username=ZeeWasHeree&theme=nightowl&layout=compact"

      - name: Commit & Push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stats.svg languages.svg
          git commit -m "Update GitHub Stats & Languages" || echo "No changes to commit"
          git push origin output
